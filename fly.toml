# fly.toml app configuration file generated for blat
# See https://fly.io/docs/reference/configuration/

app = 'blat'
primary_region = 'sin'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8080'

# Colyseus rooms are in-process memory. Keep a single machine so create/join
# always hit the same server (no Redis presence yet).
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 50

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

[deploy]
  strategy = 'immediate'
