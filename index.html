<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>blat</title>
  </head>
  <body>
    <div id="lobby">
      <div class="lobby-panel">
        <p class="lobby-brand">BLAT</p>
        <p class="lobby-tag">Jetpack deathmatch · invite friends</p>

        <label class="lobby-label" for="player-name">Name</label>
        <input id="player-name" class="lobby-input" maxlength="16" placeholder="Soldier" autocomplete="off" />

        <label class="lobby-label" for="access-password">Password</label>
        <input
          id="access-password"
          class="lobby-input"
          type="password"
          maxlength="64"
          placeholder="Shared access password"
          autocomplete="current-password"
        />

        <label class="lobby-label" for="match-mode">Mode</label>
        <select id="match-mode" class="lobby-input">
          <option value="dm">Deathmatch</option>
          <option value="tdm">Team DM</option>
          <option value="ctf">Capture the Flag</option>
          <option value="point">Pointmatch</option>
          <option value="infil">Infiltration</option>
        </select>
        <label class="lobby-check">
          <input id="match-realistic" type="checkbox" />
          Realistic (no jet · hotter guns)
        </label>

        <button id="btn-create" class="lobby-btn lobby-btn-primary" type="button">Create game</button>
        <button id="btn-demo" class="lobby-btn" type="button">Watch demo</button>

        <div class="lobby-divider"><span>or join</span></div>

        <label class="lobby-label" for="room-code">Room code</label>
        <div class="lobby-row">
          <input
            id="room-code"
            class="lobby-input lobby-input-code"
            maxlength="6"
            placeholder="ABCD"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="btn-join" class="lobby-btn" type="button">Join</button>
        </div>

        <div class="lobby-divider"><span>open rooms</span></div>
        <div id="room-list" class="room-list">Looking for rooms…</div>

        <p id="lobby-error" class="lobby-error" hidden></p>
        <p id="lobby-status" class="lobby-status" hidden></p>
      </div>
    </div>

    <div id="game-shell" hidden>
      <div id="room-bar">
        <span id="room-bar-code"></span>
        <button id="btn-copy" type="button">Copy link</button>
      </div>
      <div id="game"></div>
      <button id="sound-gate" type="button" hidden>Tap for sound</button>
      <div id="chat-dock">
        <div id="chat-log"></div>
        <input id="chat-input" maxlength="80" placeholder="T to chat · F1–F4 taunt" autocomplete="off" />
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
